<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle,#16805f,#07392e);color:white;font-family:sans-serif;overflow:hidden}.top{height:12vh;display:flex;align-items:center;justify-content:space-between;padding:0 3vw;background:#061b16cc}.gold{color:#ffd65b;font-weight:900}.table{height:70vh;position:relative;border:8px solid #74451f;border-radius:30px;margin:1vh 2vw;background:#0c644d;box-shadow:inset 0 0 40px #00291f}.center{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:#063d31;padding:2vh 5vw;border-radius:15px;text-align:center}.mult{font-size:7vh;color:#ffd65b;font-weight:1000}.p{position:absolute;text-align:center}.a{width:8vh;height:8vh;border-radius:50%;background:#e3a05c;display:flex;align-items:center;justify-content:center;font-size:5vh;border:3px solid #ffd76a}.pt{top:2vh;left:48%}.pl{left:2vw;top:42%}.pr{right:2vw;top:42%}.hand{height:15vh;display:flex;justify-content:center;align-items:end;gap:.2vw}.tile{width:6.3vw;height:13vh;background:#fffbea;color:#222;border-radius:6px;border-bottom:6px solid #b9ae8f;font-size:4vh;font-weight:900;display:flex;align-items:center;justify-content:center}.bar{position:absolute;right:2vw;top:2vh}.btn{border:0;border-radius:10px;padding:1.5vh 2vw;font-weight:900;background:#e5a51e;color:#3a2500}.start{position:absolute;left:50%;bottom:2vh;transform:translateX(-50%)}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center}.panel{background:#123c32;border:2px solid #d7aa45;border-radius:20px;padding:4vh 5vw;width:55vw}.row{display:flex;justify-content:space-between;margin:2vh 0}input,select{width:22vw;padding:1vh;background:#061914;color:#fff;border:1px solid #777;border-radius:8px}</style></head><body><div class="top"><b class="gold">🀄 欢乐麻将 · 离线高倍版</b><div>欢乐豆 <span class="gold" id="bal"></span></div><button class="btn" onclick="admin()">⚙ 后台</button></div><div class="table"><div class="p pt"><div class="a">😎</div>阿杰</div><div class="p pl"><div class="a">👩</div>小敏</div><div class="p pr"><div class="a">🧔</div>老王</div><div class="center"><div>东一局</div><div class="mult" id="m">×8</div><small id="tip">飞机模式可玩</small></div><button class="btn start" onclick="deal()">🎲 开始 / 换一局</button></div><div class="hand" id="hand"></div><div class="modal" id="adm"><div class="panel"><h2 class="gold">单机后台</h2><div class="row">欢乐豆<input id="b" type="number"></div><div class="row">底分<select id="base"><option>10000</option><option>50000</option><option>100000</option><option>500000</option></select></div><div class="row">倍率<select id="mul"><option>8</option><option>16</option><option>32</option><option>64</option><option>128</option><option>256</option><option>512</option><option>1024</option></select></div><button class="btn" onclick="save()">保存并返回</button></div></div><script>let cfg=JSON.parse(localStorage.getItem('cfg')||'{"b":8888888,"base":10000,"m":8}');const chars=['一萬','二萬','三萬','四萬','五萬','六萬','七萬','八萬','九萬','一筒','二筒','三筒','四筒','五筒','六筒','七筒','八筒','九筒','一条','二条','三条','四条','五条','六条','七条','八条','九条','東','南','西','北','中','發','白'];function ui(){bal.textContent=cfg.b.toLocaleString();m.textContent='×'+cfg.m}function deal(){hand.innerHTML='';let a=[];for(let i=0;i<14;i++)a.push(chars[Math.floor(Math.random()*chars.length)]);a.forEach((x,i)=>{let d=document.createElement('div');d.className='tile';d.textContent=x;d.onclick=()=>{d.remove();tip.textContent='打出 '+x+' · 对手思考中…';setTimeout(()=>{deal()},900)};hand.appendChild(d)});tip.textContent='高倍场 · 点击牌即可出牌'}function admin(){b.value=cfg.b;base.value=cfg.base;mul.value=cfg.m;adm.style.display='flex'}function save(){cfg.b=+b.value;cfg.base=+base.value;cfg.m=+mul.value;localStorage.setItem('cfg',JSON.stringify(cfg));adm.style.display='none';ui()}ui();deal();</script></body></html>
